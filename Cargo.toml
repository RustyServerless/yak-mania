[workspace]
members = ["rust/lambdas/*", "tools/*"]
resolver = "2"

[workspace.package]
rust-version = "1.85.0"
edition = "2024"
authors = ["Jérémie RODON <jeremie.rodon@gmail.com>"]
license = "MIT"

[workspace.dependencies]
lambda-appsync = { version = "0.11.0", features = ["env_logger"] }
dynamodb-facade = "0.2"

# awssdk-instrumentation = "0.2"
awssdk-instrumentation = { version = "0.2", git = "https://github.com/RustyServerless/awssdk-instrumentation", branch = "feat/extra_init_code" }
# awssdk-instrumentation = { version = "0.2", path = "/home/firkraag/git/perso/awssdk-instrumentation" }

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }

tokio = { version = "1", features = ["macros", "signal"] }
aws_lambda_events = "1"
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = { version = "0.1"}
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

rand = "0.9"
